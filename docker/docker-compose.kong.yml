version: '3.8'

services:
  db:
    container_name: shms-db
    image: postgres:16
    user: root
    ports:
      - "5437:5432"
    environment:
      - POSTGRES_USER=ushms #ushms
      - POSTGRES_PASSWORD=IIEvAIBADANBgkqhkiG # IIEvAIBADANBgkqhkiG
      - POSTGRES_DB=postgres # Ensure the database exists or use 'postgres'
    restart: always
    networks:
      - kong-net
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ushms -d postgres" ] # Match the database name here
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.8.0
    container_name: kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: db
      KONG_PG_USER: ushms
      KONG_PG_PASSWORD: IIEvAIBADANBgkqhkiG
      KONG_PG_DATABASE: postgres
    networks:
      - kong-net
    depends_on:
      db:
        condition: service_healthy
    command: [ "kong", "migrations", "bootstrap" ] # Run migrations for Kong
    restart: on-failure

  kong:
    build:
      context: ./kong
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KONG_PG_HOST: db
      KONG_DATABASE: postgres
      KONG_PG_PORT: 5432
      KONG_PG_USER: ushms
      KONG_PG_PASSWORD: IIEvAIBADANBgkqhkiG
      KONG_PG_DATABASE: postgres
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"
      - "8002:8002"
    networks:
      - kong-net
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./kong:/opt/kong

volumes:
  db_data:


networks:
  kong-net:
    external: false # Remove this if you want Docker Compose to manage the network automatically
